{% extends "base.html" %}


{% block title %}
Register | Blog Management System
{% endblock %}


{% block content %}


<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">


        <div class="card shadow border-0">

            <div class="card-body p-4 p-md-5">


                <h2 class="text-center mb-2">
                    Create Account
                </h2>


                <p class="text-center text-muted mb-4">

                    Register a new account

                </p>


                <form method="post">

                    {% csrf_token %}


                    <!-- Username -->

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required
                        >

                    </div>


                    <!-- Full Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter email"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >

                        <div class="form-text">
                            Password must be at least 8 characters.
                        </div>

                    </div>


                    <!-- Confirm Password -->

                    <div class="mb-4">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >
                        Register
                    </button>


                </form>


                <hr>


                <p class="text-center mb-0">

                    Already have an account?

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                </p>


            </div>

        </div>


    </div>

</div>


{% endblock %}
