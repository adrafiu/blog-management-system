{% extends "base.html" %}


{% block title %}
Login | Blog Management System
{% endblock %}


{% block content %}


<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">


        <div class="card shadow border-0">

            <div class="card-body p-4 p-md-5">


                <h2 class="text-center mb-2">
                    Login
                </h2>


                <p class="text-center text-muted mb-4">

                    Login to manage your blog posts.

                </p>


                <form method="post">

                    {% csrf_token %}


                    <!-- Username -->

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Login
                    </button>


                </form>


                <hr>


                <p class="text-center mb-0">

                    Don't have an account?

                    <a href="{% url 'register' %}">
                        Register
                    </a>

                </p>


            </div>

        </div>


    </div>

</div>


{% endblock %}
