{% extends "base.html" %}


{% block title %}
{{ page_title }}
{% endblock %}


{% block content %}


<div class="row justify-content-center">

    <div class="col-md-9 col-lg-8">


        <div class="card shadow border-0">

            <div class="card-body p-4">


                <h2 class="mb-4">
                    {{ page_title }}
                </h2>


                <form
                    method="post"
                    enctype="multipart/form-data"
                >

                    {% csrf_token %}


                    <!-- Title -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Blog Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ blog.title|default:'' }}"
                            placeholder="Enter blog title"
                            required
                        >

                    </div>


                    <!-- Content -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Content
                        </label>

                        <textarea
                            name="content"
                            class="form-control"
                            rows="8"
                            placeholder="Write your blog content..."
                            required
                        >{{ blog.content|default:'' }}</textarea>

                    </div>


                    <!-- Category -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Category
                        </label>

                        <select
                            name="category"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Category
                            </option>


                            <option
                                value="Educational"

                                {% if blog.category == "Educational" %}
                                    selected
                                {% endif %}
                            >
                                Educational
                            </option>


                            <option
                                value="Technologies"

                                {% if blog.category == "Technologies" %}
                                    selected
                                {% endif %}
                            >
                                Technologies
                            </option>


                            <option
                                value="Sports"

                                {% if blog.category == "Sports" %}
                                    selected
                                {% endif %}
                            >
                                Sports
                            </option>


                        </select>

                    </div>


                    <!-- Image -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Blog Image
                        </label>

                        <input
                            type="file"
                            name="blog_image"
                            class="form-control"
                            accept="image/*"
                        >


                        {% if blog.blog_image %}

                            <div class="mt-3">

                                <p class="mb-2">
                                    Current Image:
                                </p>

                                <img
                                    src="{{ blog.blog_image.url }}"
                                    class="img-thumbnail"
                                    style="
                                    max-width:200px;
                                    "
                                >

                            </div>

                        {% endif %}


                    </div>


                    <!-- Buttons -->

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Save Blog
                    </button>


                    <a
                        href="{% url 'blog_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>


                </form>


            </div>

        </div>


    </div>

</div>


{% endblock %}
